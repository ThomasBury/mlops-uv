[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "acebet.__version__"}

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["acebet*"]  # package names should match these glob patterns (["*"] by default)

[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "ipykernel>=6.29.5",
    "markdown>=3.6",
    "matplotlib>=3.9.2",
    "nbclient>=0.10.2",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.7",
    "ty>=0.0.65",
    "zensical",
]
mlops = [
    "mlflow>=2.20.0",
]

[tool.setuptools]
package-data = {"*" = ["**/*.feather", "**/*.joblib", "**/*.json", "**/*.md"]}

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "src/acebet/__init__.py"}]

[tool.fastapi]
entrypoint = "acebet.app.main:app"

[project]
name = "acebet"
dynamic = ["version"]
requires-python = ">=3.10, <3.13"
description = "Oracle of the Tennis Champion, mock-up of a bet prediction app"
authors = [{name = "Thomas Bury", email = "bury.thomas@gmail.com"}]
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["tennis", "bet", "prediction", "oracle", "sportbet"]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3"
]
dependencies = [
    "bcrypt>=4.2.0",
    "fastapi>=0.162.5,<0.163",
    "fastapi-cli>=0.0.33,<0.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.30.6",
    "joblib>=1.4.2",
    "lightgbm>=4.6.0",
    "numpy>=2.1.2",
    "pandas>=2.2.3",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "prometheus-client>=0.21.1",
    "python-jose[cryptography]>=3.5.0",
    "scikit-learn>=1.5.0",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
]

[project.scripts]
acebet-replay = "acebet.forecast:main"

[project.optional-dependencies]
tracing = [
    "opentelemetry-api>=1.32.0",
    "opentelemetry-exporter-otlp-proto-http>=1.32.0",
    "opentelemetry-instrumentation-fastapi>=0.53b0",
    "opentelemetry-sdk>=1.32.0",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.10"

[tool.pytest.ini_options]
markers = [
    "api: API and application-integration coverage executed on Python 3.12",
    "packaging: wheel, sdist, and isolated-install checks executed on Python 3.12",
    "tracing: optional OpenTelemetry checks executed with the tracing extra",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/acebet"]

[tool.coverage.report]
fail_under = 80
show_missing = true
