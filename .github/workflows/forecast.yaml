name: Historical forecast

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Run standalone forecast tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: just forecast-test
      - name: Rehearse release decisions in a temporary registry
        run: just forecast-release-test
      - name: Build and replay a candidate
        run: just forecast-candidate "$RUNNER_TEMP/forecast"
      - name: Verify the checkout stayed unchanged
        run: test -z "$(git status --porcelain)"
      - name: Upload candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: historical-forecast
          path: |
            ${{ runner.temp }}/forecast/*.json
            ${{ runner.temp }}/forecast/matches.parquet
            ${{ runner.temp }}/forecast/bundle/
          if-no-files-found: error
