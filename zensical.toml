[project]
site_name = "Classical MLOps and ML Engineering"
site_url = "https://mlops-uv-tutorial.bury-thomas.workers.dev/"
copyright = '<a href="/privacy/">Privacy</a>'
extra_css = ["stylesheets/brand.css"]
nav = [
  {"Course overview" = "index.md"},
  {"Lessons" = [
    "tutorial/index.md",
    {"1. Define a pre-match probability" = "tutorial/forecast-contract.md"},
    {"2. Put the forecast in a Python package" = "tutorial/reproduce-the-fixture.md"},
    {"3. Rebuild the match dataset" = "tutorial/rebuild-match-history.md"},
    {"4. Build features from what was known" = "tutorial/build-point-in-time-features.md"},
    {"5. Train under deployment conditions" = "tutorial/train-under-deployment-conditions.md"},
    {"6. Freeze a candidate and judge the evidence" = "tutorial/evaluate-a-forecast.md"},
    {"7. Serve the frozen forecast" = "tutorial/serve-the-frozen-forecast.md"},
    {"8. Reproduce the service on another machine" = "tutorial/reproduce-the-forecast-runtime.md"},
    {"9. Investigate a forecast after serving" = "tutorial/diagnose-and-roll-back-a-forecast.md"},
    {"10. Decide what a scheduled run may change" = "tutorial/automate-and-audit-a-forecast.md"}
  ]},
  {"Commands and interfaces" = [
    "reference/index.md",
    {"Historical replay" = "reference/historical-forecast.md"},
    {"Packaged quickstart" = "getting-started.md"},
    {"Authenticated API" = "api/sync-endpoints.md"},
    {"Packaged model and data" = "user-guide/model-artifacts-and-promotion.md"},
    {"Contributor commands" = "uv/uv-workflows-for-mlops.md"},
    {"Continuous integration" = "cicd/github-actions-pipeline.md"},
    {"Container targets" = "deployment/docker-and-github-actions.md"},
    {"Privacy" = "privacy.md"}
  ]},
  {"Optional labs" = [
    {"Measure a blocked event loop" = "labs/event-loop.md"}
  ]}
]

[project.theme]
custom_dir = "overrides"
logo = "images/acebet-mark.svg"
favicon = "images/acebet-mark.svg"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"
primary = "custom"
accent = "custom"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "custom"
accent = "custom"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "custom"
accent = "custom"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[build]
source = "docs"
output = "site"
